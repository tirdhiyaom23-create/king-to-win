DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King To Win</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 0%,#3b2a00 0%,#151006 28%,#050505 65%);
  overflow-x:hidden;
}

/* TOP */
.top{
  padding:24px 18px 12px;
  text-align:center;
}

.crown{
  font-size:52px;
  filter:drop-shadow(0 0 15px #ffd84d);
  animation:float 2.5s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.title{
  margin-top:8px;
  font-size:31px;
  font-weight:900;
  letter-spacing:3px;
  color:#ffd84d;
  text-shadow:0 0 15px rgba(255,216,77,.45);
}

.subtitle{
  margin-top:7px;
  color:#aaa;
  font-size:13px;
  letter-spacing:2px;
}

/* MAIN CARD */
.panel{
  width:92%;
  max-width:480px;
  margin:28px auto;
  padding:24px;
  border:1px solid rgba(255,216,77,.28);
  border-radius:25px;
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(12px);
  box-shadow:
    0 15px 50px rgba(0,0,0,.65),
    inset 0 0 25px rgba(255,216,77,.035);
}

/* SITE CARD */
.site{
  position:relative;
  display:flex;
  align-items:center;
  gap:16px;
  padding:18px;
  border-radius:19px;
  text-decoration:none;
  color:white;
  background:linear-gradient(135deg,#211b0b,#0d0d0d);
  border:1px solid rgba(255,216,77,.35);
  overflow:hidden;
  transition:.25s;
}

.site:before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );
  transform:skewX(-20deg);
  transition:.6s;
}

.site:hover:before{
  left:130%;
}

.site:active{
  transform:scale(.97);
}

/* ICON */
.icon{
  width:62px;
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  font-size:32px;
  background:linear-gradient(145deg,#ffd84d,#a87800);
  box-shadow:
    0 0 20px rgba(255,216,77,.3),
    inset 0 1px 2px #fff6;
}

/* TEXT */
.info{
  flex:1;
}

.name{
  font-size:20px;
  font-weight:800;
  letter-spacing:1px;
}

.status{
  margin-top:6px;
  font-size:12px;
  color:#9d9d9d;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:#37e879;
  box-shadow:0 0 8px #37e879;
}

/* ARROW */
.arrow{
  font-size:27px;
  color:#ffd84d;
}

/* FOOTER */
.footer{
  text-align:center;
  color:#666;
  font-size:11px;
  letter-spacing:1px;
  margin-top:30px;
}

/* DECORATION */
.line{
  width:75px;
  height:2px;
  margin:14px auto 0;
  background:linear-gradient(90deg,transparent,#ffd84d,transparent);
}
</style></head><body><div class="top">  <div class="crown">👑</div>  <div class="title">
    KING TO WIN
  </div>  <div class="line"></div>  <div class="subtitle">
    WELCOME TO THE KINGDOM
  </div></div><div class="panel"><a class="site"
href="https://kingtowin.example"
target="_blank">

<div class="icon">♛</div>

<div class="info">
  <div class="name">KING TO WIN</div>

  <div class="status">
    <span class="dot"></span>
    ONLINE
  </div>
</div>

<div class="arrow">›</div>

  </a></div><div class="footer">
  KING TO WIN • PREMIUM PANEL
</div></body>
</html>
